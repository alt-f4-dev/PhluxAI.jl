name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

jobs:
  documentation:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write

    env:
      PHLUXAI_SKIP_OLLAMA_INSTALL: '1'
      PHLUXAI_SKIP_COMFY_INSTALL: '1'
      PHLUXAI_BANNER: '0'
      RESEAU_PRECOMPILE_ONLY: 'eventloops,internal_poll,socket_ops,tcp,host_resolvers'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2

      - name: Instantiate documentation environment
        shell: julia --color=yes --project=docs {0}
        run: |
          using Pkg
          Pkg.instantiate()

      - name: Build and deploy documentation
        run: julia --color=yes --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
